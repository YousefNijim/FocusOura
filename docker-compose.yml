version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: focusoura_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: focusoura
      POSTGRES_PASSWORD: focusoura
      POSTGRES_DB: focusoura
    ports:
      - "5432:5432"
    volumes:
      - focusoura_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusoura"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  focusoura_pgdata:
    driver: local
